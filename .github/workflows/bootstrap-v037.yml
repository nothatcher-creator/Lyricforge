name: Bootstrap LyricForge v0.3.7

on:
  push:
    branches: [superpowers-v037]
    paths:
      - '.sync-v037/**'
      - '.github/workflows/bootstrap-v037.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: superpowers-v037
          fetch-depth: 0

      - name: Preserve current deployment workflow
        run: cp .github/workflows/pages.yml /tmp/pages-current.yml

      - name: Reconstruct verified v0.3.6 Pages baseline
        run: bash tools/build-pages.sh

      - name: Reconstruct and verify v0.3.7 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .sync-v037/patch*.b64 | base64 -d > /tmp/v037.patch.xz
          echo 'af7e823a6e0f73f5347f0c1419d57be511cd1bf34615c8ed173f01f07a9c0390  /tmp/v037.patch.xz' | sha256sum -c -
          xz -dc /tmp/v037.patch.xz > /tmp/v037.patch
          echo 'c58d5f31bd4458ac07909f871b636bfc358f1433a117d818b11ec937e4c4a284  /tmp/v037.patch' | sha256sum -c -

      - name: Apply verified source update
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v037-package
          cp -a _site /tmp/v037-package
          cd /tmp/v037-package
          git init -q
          git config user.name bootstrap
          git config user.email bootstrap@localhost
          git add -A
          git commit -qm baseline
          git apply --check /tmp/v037.patch
          git apply /tmp/v037.patch
          bash tools/build-pages.sh
          node --test tests/*.test.mjs

      - name: Promote canonical source without rewriting workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v037-package/.git
          cp -a /tmp/v037-package/. .
          rm -rf .sync-v037
          bash tools/build-pages.sh
          node --test tests/*.test.mjs
          cp /tmp/pages-current.yml .github/workflows/pages.yml
          rm -f .github/workflows/tests.yml
          git add -A
          git reset -- .github/workflows
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'Refusing to bootstrap workflow-file changes.' >&2
            exit 1
          fi

      - name: Commit verified canonical v0.3.7 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: implement LyricForge v0.3.7 superpowers plans'
          git push origin HEAD:superpowers-v037

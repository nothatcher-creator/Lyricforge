name: LyricForge tests

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Node suite
        run: npm test
        env:
          CHROME_BIN: /usr/bin/chromium
      - name: Chromium portrait and editor layout
        run: npm run test:browser
        env:
          CHROME_BIN: /usr/bin/chromium
      - name: Build canonical Pages artifact
        run: bash tools/build-pages.sh
